name: Sync Google Sheets to Neon

on:
  schedule:
    # Executa a cada 30 minutos (horário UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch: # Permite execução manual pela aba Actions

# Impede que duas execuções rodem ao mesmo tempo e disputem a tabela no Neon
concurrency:
  group: elt-sheets-neon
  cancel-in-progress: false

jobs:
  run-elt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar pipeline ELT
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: python etl.py